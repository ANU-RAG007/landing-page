<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpeedX Creator - Landing Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: rgba(0, 0, 0, 0.6);
    }

    .container {
      text-align: center;
      color: white;
      padding: 60px 20px 20px;
      flex: 1;
    }

    .profile-img-wrapper {
      width: 160px;
      height: 160px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 20px 0 5px;
      font-size: 32px;
    }

    p {
      font-size: 18px;
      color: #ddd;
    }

    .links {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .link-wrapper {
      position: relative;
      width: 90%;
      max-width: 300px;
      margin: 10px 0;
      overflow: hidden;
    }

    .links a {
      display: block;
      background-color: #ff3c00;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      position: relative;
      z-index: 2;
    }

    .links a:hover {
      background-color: #cc2f00;
    }

    .car {
      position: absolute;
      left: -40px;
      bottom: 5px;
      width: 30px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 3;
    }

    .link-wrapper:hover .car {
      opacity: 1;
    }

    .car.animate-car {
      animation: driveCar 2s forwards;
    }

    @keyframes driveCar {
      0% {
        left: -40px;
      }
      100% {
        left: calc(100% - 30px);
      }
    }

    .smoke {
      position: absolute;
      width: 10px;
      height: 10px;
      background: url('smoke.png') no-repeat center center / cover;
      opacity: 0.8;
      pointer-events: none;
      animation: smokeAnim 1s linear forwards;
    }

    @keyframes smokeAnim {
      0% {
        transform: scale(1) translateY(0);
        opacity: 0.8;
      }
      100% {
        transform: scale(2) translateY(-20px);
        opacity: 0;
      }
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>

<video autoplay muted loop class="bg-video">
  <source src="background.mp4" type="video/mp4">
  Your browser does not support HTML5 video.
</video>

<div class="wrapper">
  <div class="container">
    <div class="profile-img-wrapper">
      <img src="profile3.jpg" alt="Profile Image" class="profile-img">
    </div>

    <h1>SpeedX Creator</h1>
    <p>Car Content | Drift Addict | Affiliate Gear Guide</p>

    <div class="links">
      <div class="link-wrapper">
        <img src="car.png" class="car" alt="Car">
        <a href="#" onclick="animateAndGo(event, this)">📺 YouTube Channel</a>
      </div>
      <div class="link-wrapper">
        <img src="car.png" class="car" alt="Car">
        <a href="#" onclick="animateAndGo(event, this)">🚗 Car Gear Deals</a>
      </div>
      <div class="link-wrapper">
        <img src="car.png" class="car" alt="Car">
        <a href="#" onclick="animateAndGo(event, this)">📸 Instagram</a>
      </div>
      <div class="link-wrapper">
        <img src="car.png" class="car" alt="Car">
        <a href="#" onclick="animateAndGo(event, this)">📩 Contact Me</a>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 SpeedX Creator | Built for car lovers ❤️</p>
  </footer>
</div>

<audio id="driftSound" src="drift.mp3" preload="auto"></audio>

<script>
  function animateAndGo(event, link) {
    event.preventDefault();
    const wrapper = link.parentElement;
    const car = wrapper.querySelector('.car');
    const sound = document.getElementById('driftSound');

    car.classList.add('animate-car');
    sound.currentTime = 0;
    sound.play();

    let interval = setInterval(() => {
      const smoke = document.createElement('div');
      smoke.className = 'smoke';
      const carRect = car.getBoundingClientRect();
      const wrapperRect = wrapper.getBoundingClientRect();
      smoke.style.left = (car.offsetLeft + 10) + 'px';
      smoke.style.bottom = '5px';
      wrapper.appendChild(smoke);
      setTimeout(() => wrapper.removeChild(smoke), 1000);
    }, 100);

    setTimeout(() => {
      clearInterval(interval);
      car.classList.remove('animate-car');
      window.location.href = link.href;
    }, 1400);
  }
</script>

</body>
</html>
