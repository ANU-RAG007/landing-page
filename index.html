<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpeedX Creator - Landing Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: rgba(0, 0, 0, 0.6);
    }

    .container {
      text-align: center;
      color: white;
      padding: 60px 20px 20px;
      flex: 1;
    }

    /* Circular Profile Image */
    .profile-img-wrapper {
      width: 160px;
      height: 160px;
      margin: 0 auto;
      border-radius: 50%; /* Make the image circular */
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 20px 0 5px;
      font-size: 32px;
    }

    p {
      font-size: 18px;
      color: #ddd;
    }

    .links {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .links a {
      width: 90%;
      max-width: 300px;
      background-color: #ff3c00;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin: 10px 0;
      transition: 0.3s;
    }

    .links a:hover {
      background-color: #cc2f00;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>

<video autoplay muted loop class="bg-video">
  <source src="background.mp4" type="video/mp4">
  Your browser does not support HTML5 video.
</video>

<div class="wrapper">
  <div class="container">
    <!-- Circular Profile Image -->
    <div class="profile-img-wrapper">
      <!-- Ensure the image file is named "profile.jpg" and is in the same folder -->
      <img src="profile3.jpg" alt="Profile Image" class="profile-img">
    </div>

    <h1>SpeedX Creator</h1>
    <p>Car Content | Drift Addict | Affiliate Gear Guide</p>

    <div class="links">
      <a href="#">📺 YouTube Channel</a>
      <a href="#">🚗 Car Gear Deals</a>
      <a href="#">📸 Instagram</a>
      <a href="#">📩 Contact Me</a>
    </div>
  </div>

  <footer>
    <p>© 2025 SpeedX Creator | Built for car lovers ❤️</p>
  </footer>
</div>

</body>
</html>
